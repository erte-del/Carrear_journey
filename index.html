<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Career Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--bg:#1b1140;--panel:#12124a;--ink:#fff;--gold:#ffd23f;--pink:#ff5fa2;--cyan:#3de0ff;--muted:#b9a8ff}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Press Start 2P',ui-monospace,Menlo,monospace}
body{min-height:100vh;display:flex;justify-content:center;padding:16px;
  background-image:radial-gradient(#ffffff14 1px,transparent 1px);background-size:12px 12px}
.wrap{width:100%;max-width:960px}
h1{font-size:clamp(11px,2.6vw,16px);margin:4px 0 14px;color:var(--gold);text-shadow:3px 3px 0 #000;letter-spacing:1px}
h1 span{color:var(--cyan)}
.stage{position:relative;width:100%;aspect-ratio:16/9;background:#000;border:4px solid #000;
  box-shadow:0 0 0 4px var(--gold),6px 6px 0 4px #000;overflow:hidden}
canvas{width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges}
.hud{position:absolute;top:6px;background:#000c;border:3px solid #fff;padding:5px 7px;
  font-size:clamp(8px,2.2vw,14px);line-height:1;pointer-events:none;text-shadow:2px 2px 0 #000}
.year{right:6px;color:var(--gold);font-size:clamp(10px,3vw,20px)}
.lvl{left:6px;color:var(--cyan)}
.lvl b{display:block;margin-top:4px;height:5px;width:100%;background:#333;position:relative}
.lvl b i{position:absolute;inset:0 auto 0 0;background:var(--pink);width:0}
.progress{height:8px;background:#000;border:2px solid #fff;margin-top:18px;cursor:pointer}
.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pink),var(--gold))}
.dialog{margin-top:14px;background:var(--panel);border:4px solid #fff;box-shadow:0 0 0 4px #000,6px 6px 0 4px #000;
  padding:12px 14px;min-height:118px;font-size:clamp(8px,2.2vw,12px);line-height:1.75;position:relative}
.dialog .who{color:var(--gold);margin-bottom:4px}
.dialog .role{color:var(--cyan);margin-bottom:6px}
.dialog .txt::after{content:'▼';color:var(--pink);margin-left:6px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
button{font:inherit;font-size:clamp(8px,2.2vw,10px);padding:10px 12px;background:var(--pink);color:#fff;border:3px solid #000;
  box-shadow:3px 3px 0 #000;cursor:pointer;text-shadow:1px 1px 0 #000}
button:hover{filter:brightness(1.1)}
button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #000}
button:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
#play{background:#2bb24c;min-width:96px}
#spd{background:#7a5cff}
#snd{background:#ff9f1a}
#snd.off{background:#555}
.sym{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-size:1.2em;line-height:1}
.chips{position:relative;display:flex;gap:6px;overflow-x:auto;padding:4px 2px 10px;margin-top:12px}
.chip{flex:0 0 auto;background:#2a1a6e;font-size:9px;padding:8px 9px}
.chip.on{background:var(--gold);color:#000;text-shadow:none}
.note{font-size:8px;color:var(--muted);margin-top:8px;line-height:1.8}
@media (prefers-reduced-motion: reduce){.dialog .txt::after{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <h1>CAREER QUEST <span>· Ersin İnankul</span></h1>
  <div class="stage">
    <canvas id="c" width="480" height="270" role="img" aria-label="Pixel-art animation of Ersin İnankul's career journey from Kayseri in 1998 to Dubai today"></canvas>
    <div class="hud lvl" id="lvl">LV 1<b><i id="xp"></i></b></div>
    <div class="hud year" id="year">1998</div>
  </div>
  <div class="progress" id="prog" title="Seek"><i id="bar"></i></div>
  <div class="dialog">
    <div class="who" id="dwho"></div>
    <div class="role" id="drole"></div>
    <div class="txt" id="dtxt"></div>
  </div>
  <div class="controls">
    <button id="prev" aria-label="Previous stop">◀◀</button>
    <button id="play" aria-label="Play or pause">❚❚ PAUSE</button>
    <button id="next" aria-label="Next stop">▶▶</button>
    <button id="spd" aria-label="Playback speed">SPEED 1×</button>
    <button id="snd" aria-label="Sound on or off">♪ SOUND ON</button>
  </div>
  <div class="chips" id="chips" aria-label="Skip to stop"></div>
  <div class="note" id="note">Keys: space = play/pause · ←/→ = previous/next stop · M = sound. Tap anywhere to start the music.</div>
</div>
<script>
"use strict";
// ================= CORE =================
const W=480,H=270;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
ctx.imageSmoothingEnabled=false;
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const FONT="'Press Start 2P',ui-monospace,monospace";
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const easeOut=t=>1-Math.pow(1-clamp(t),3);
const easeIO=t=>{t=clamp(t);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2};
const backOut=t=>{t=clamp(t);const c1=2.2,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)};
const bounceOut=t=>{t=clamp(t);const n=7.5625,d=2.75;if(t<1/d)return n*t*t;if(t<2/d)return n*(t-=1.5/d)*t+.75;if(t<2.5/d)return n*(t-=2.25/d)*t+.9375;return n*(t-=2.625/d)*t+.984375};
let seed=7;const srand=()=>((seed=(seed*16807)%2147483647)/2147483647);
function R(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h));}
function T(s,x,y,size,col,align='left',sh='#000'){
  s=String(s);
  if(s.includes('→')){ // the pixel font has no real arrow glyph, so draw one in pixels
    const parts=s.split('→'),aw=Math.max(Math.round(size*1.6),Math.ceil(size/6)*7);ctx.font=size+'px '+FONT;
    const ws=parts.map(q=>ctx.measureText(q).width),tot=ws.reduce((a,b)=>a+b,0)+aw*(parts.length-1);
    let sx=align==='center'?x-tot/2:align==='right'?x-tot:x;
    parts.forEach((q,i)=>{T(q,sx,y,size,col,'left',sh);sx+=ws[i];if(i<parts.length-1){arrowG(sx,y,size,aw,col,sh);sx+=aw;}});return;
  }
  ctx.font=size+'px '+FONT;ctx.textAlign=align;ctx.textBaseline='top';
  if(sh){ctx.fillStyle=sh;ctx.fillText(s,Math.round(x)+1,Math.round(y)+1);}
  ctx.fillStyle=col;ctx.fillText(s,Math.round(x),Math.round(y));
}
function arrowG(x,y,size,w,col,sh){const u=Math.ceil(size/6),cy=Math.round(y+size/2-u/2);
  const d=(o,c)=>{R(x+o+u*2,cy+o,w-5*u,u,c);R(x+o+w-5*u,cy+o-2*u,u,5*u,c);R(x+o+w-4*u,cy+o-u,u,3*u,c);R(x+o+w-3*u,cy+o,u,u,c);};
  if(sh)d(1,sh);d(0,col);}
function tw(s,size){ctx.font=size+'px '+FONT;return ctx.measureText(s).width;}
// draw a pixel map (array of strings) with a colour table
function spr(map,pal,x,y,u=2,flip=false){
  const w=map[0].length;
  for(let j=0;j<map.length;j++)for(let i=0;i<w;i++){
    const c=map[j][flip?w-1-i:i];if(c==='.'||!pal[c])continue;
    ctx.fillStyle=pal[c];ctx.fillRect(Math.round(x+i*u),Math.round(y+j*u),u,u);
  }
}
const RAINBOW=['#ff4d6d','#ffb000','#ffe45e','#4be37a','#3de0ff','#7a5cff','#ff5fa2'];

// ================= AUDIO (original chiptune, Web Audio) =================
const snd={on:true,ac:null,master:null,mus:null,fx:null,noise:null,step:0,next:0,pat:'A',want:'A',lastBoom:0};
try{if(localStorage.getItem('cq-sound')==='off')snd.on=false;}catch(e){}
function audioInit(){
  if(snd.ac)return;const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
  const ac=snd.ac=new AC();snd.master=ac.createGain();snd.master.gain.value=.2;snd.master.connect(ac.destination);
  snd.mus=ac.createGain();snd.mus.gain.value=.55;snd.mus.connect(snd.master);
  snd.fx=ac.createGain();snd.fx.gain.value=.9;snd.fx.connect(snd.master);
  const b=ac.createBuffer(1,ac.sampleRate,ac.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;snd.noise=b;
}
const ok=()=>snd.on&&snd.ac&&snd.ac.state==='running';
const hz=m=>440*Math.pow(2,(m-69)/12);
function tone(type,f,t0,dur,vol,dest,f2,glide){
  const ac=snd.ac,o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,t0);
  if(f2)o.frequency.exponentialRampToValueAtTime(f2,t0+(glide||dur));
  g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(vol*.6,t0+dur*.6);g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  o.connect(g);g.connect(dest||snd.fx);o.start(t0);o.stop(t0+dur+.03);
}
function hiss(t0,dur,vol,ff,ft,dest,ff2){
  const ac=snd.ac,src=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();src.buffer=snd.noise;
  f.type=ft||'highpass';f.frequency.setValueAtTime(ff,t0);if(ff2)f.frequency.exponentialRampToValueAtTime(ff2,t0+dur);
  g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  src.connect(f);f.connect(g);g.connect(dest||snd.fx);src.start(t0,Math.random()*.5);src.stop(t0+dur+.03);
}
const at=()=>snd.ac.currentTime+.01;
const SFX={
  coin(){if(!ok())return;const t=at();tone('square',hz(84),t,.07,.16);tone('square',hz(91),t+.07,.38,.16);},
  jump(v=.13){if(!ok())return;const t=at();tone('square',190,t,.2,v,null,640,.17);},
  pop(){if(!ok())return;const t=at();tone('square',880,t,.09,.12,null,300,.08);},
  ding(){if(!ok())return;const t=at();tone('square',hz(88),t,.12,.12);tone('square',hz(95),t+.1,.3,.12);},
  chime(){if(!ok())return;const t=at();[76,79,84,88].forEach((m,i)=>tone('square',hz(m),t+i*.07,.14,.13));},
  power(){if(!ok())return;const t=at();[60,64,67,72,64,67,72,76,67,72,76,79,72,76,79,84].forEach((m,i)=>tone('square',hz(m+7),t+i*.04,.06,.12));},
  levelUp(){if(!ok())return;const t=at();[72,76,79,84,79,84].forEach((m,i)=>tone('square',hz(m),t+i*.08,.09,.16));
    [88,84,79].forEach(m=>tone('square',hz(m),t+.5,.7,.09));tone('triangle',hz(48),t+.5,.7,.35);hiss(t+.5,.25,.12,5000);},
  fanfare(){if(!ok())return;const t=at(),q=.11;
    [[67,0,1],[67,1,1],[67,2,1],[72,3,3],[71,6,1],[72,7,1],[76,8,6]].forEach(([m,s0,l])=>{tone('square',hz(m),t+s0*q,l*q*.95,.16);tone('square',hz(m-12),t+s0*q,l*q*.95,.06);});
    [[48,0,3],[43,3,3],[48,6,8]].forEach(([m,s0,l])=>tone('triangle',hz(m),t+s0*q,l*q,.35));hiss(t+8*q,.3,.12,4000);},
  whoosh(){if(!ok())return;const t=at();hiss(t,.9,.14,300,'bandpass',null,3000);},
  launch(){if(!ok())return;const t=at();tone('sine',500,t,.55,.035,null,1700,.5);},
  boom(big){if(!ok())return;const ac=snd.ac;if(ac.currentTime-snd.lastBoom<.07)return;snd.lastBoom=ac.currentTime;const t=at();
    hiss(t,big?1:.6,big?.4:.25,big?1400:2200,'lowpass');tone('sine',big?120:160,t,.3,big?.4:.25,null,40,.3);
    if(big)hiss(t+.15,.8,.08,6000);},
  start(){if(!ok())return;const t=at();[60,64,67,72,76,79].forEach((m,i)=>tone('square',hz(m),t+i*.06,.08,.13));tone('square',hz(84),t+.36,.4,.14);}
};
// music: patterns written in eighth notes ('.' rest, '-' hold). Original tunes.
const NN={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
const parse=str=>str.replace(/\|/g,' ').trim().split(/\s+/).map(x=>x==='.'?0:x==='-'?-1:12*(+x.slice(-1)+1)+NN[x[0]]+(x[1]==='#'?1:0));
const PATS={
  A:{lead:parse("C5 . E5 G5 . E5 G5 C6 | . G5 E5 . D5 E5 C5 . | F5 . A5 C6 . A5 F5 A5 | G5 . B5 D6 . B5 G5 . | A5 . C6 E6 . C6 A5 C6 | F5 A5 C6 A5 F5 . D5 E5 | G5 . G5 A5 B5 . D6 . | C6 - G5 . E5 . C5 ."),
     roots:[48,48,41,43,45,41,43,48]},
  B:{lead:parse("G5 G5 G5 . E5 . G5 . | C6 - - - . . . . | A5 A5 A5 . F5 . A5 . | D6 - - - B5 . D6 . | C6 . A5 . F5 . A5 C6 | D6 . B5 . G5 . B5 D6 | E6 . D6 . C6 . G5 . | C6 - - - . G5 C6 E6"),
     roots:[48,48,41,43,41,43,48,48]}
};
const EIGHTH=60/160/2;
function scheduleStep(t){
  if(snd.step%8===0&&snd.want!==snd.pat){snd.pat=snd.want;snd.step=0;}
  const P=PATS[snd.pat],k=snd.step%64,bar=Math.floor(k/8),i=k%8,n=P.lead[k],r=P.roots[bar];
  if(n>0){let h=1;while(P.lead[(k+h)%64]===-1)h++;tone('square',hz(n),t,h*EIGHTH*.92,.1,snd.mus);tone('square',hz(n)*1.005,t,h*EIGHTH*.92,.03,snd.mus);}
  if(i%2===0)tone('triangle',hz(r+[0,7,12,7][i/2]),t,EIGHTH*.9,.32,snd.mus);
  else{const third=(r%12===9)?3:4;[12,12+third,19].forEach(o=>tone('square',hz(r+o+12),t,.07,.028,snd.mus));}
  if(i===0||i===4)tone('sine',150,t,.12,.4,snd.mus,45,.1);
  if(i===2||i===6)hiss(t,.09,.14,1800,'highpass',snd.mus);
  if(i%2===1)hiss(t,.03,.05,7500,'highpass',snd.mus);
  snd.step++;
}
function musicTick(){
  if(!ok()||!playing){snd.next=0;return;}
  const now=snd.ac.currentTime;if(!snd.next||snd.next<now)snd.next=now+.05;
  while(snd.next<now+.15){scheduleStep(snd.next);snd.next+=EIGHTH;}
}
function unlockAudio(){if(!snd.on)return;audioInit();if(snd.ac&&snd.ac.state!=='running')snd.ac.resume();}
addEventListener('pointerdown',unlockAudio);addEventListener('keydown',unlockAudio);
document.addEventListener('visibilitychange',()=>{if(!snd.ac)return;if(document.hidden)snd.ac.suspend();else if(snd.on)snd.ac.resume();});

// ================= MAP =================
const C={KAY:[35.5,38.7,'Kayseri'],IST:[28.9,41.0,'Istanbul'],TBS:[44.8,41.7,'Tbilisi'],BUS:[41.6,41.6,'Batumi'],
 NBE:[10.4,36.1,'Enfidha'],MIR:[10.8,35.4,'Monastir'],RUH:[46.7,24.7,'Riyadh'],DMM:[50.1,26.4,'Dammam'],
 SKP:[21.4,42.0,'Skopje'],OHD:[20.8,41.1,'Ohrid'],MED:[39.6,24.5,'Medina'],ADB:[27.1,38.4,'Izmir'],
 DOH:[51.5,25.3,'Doha'],JED:[39.2,21.5,'Jeddah'],MCT:[58.4,23.6,'Muscat'],TIP:[13.2,32.9,'Tripoli'],
 SEB:[14.4,27.0,'Sebha'],DXB:[55.3,25.2,'Dubai']};
const PX=lon=>(lon-8)/53*W, PY=lat=>(46.5-lat)/28.5*H;
const P=k=>({x:PX(C[k][0]),y:PY(C[k][1])});
const WATER=[
 // Mediterranean (+Aegean)
 [[7,44],[8,43.6],[10.3,43.8],[12,42.2],[15.5,40.1],[16.4,38.6],[15.6,38.1],[15.2,37],[17,39],[18.5,40.2],[19.6,39.8],[21.2,38.1],[21.8,36.6],[23.2,37.6],[23.8,39.2],[22.8,40.4],[24.2,40.8],[26.2,40.8],[26.8,39.8],[26.4,38.3],[27.4,37.2],[28.3,36.7],[30.6,36.7],[32.2,36.1],[34.1,36.8],[36.1,36.8],[35.9,35.1],[35.1,33.4],[34.4,31.6],[32.2,31.3],[29.9,31.2],[25,31.9],[23.2,32.6],[20.1,30.9],[19,30.3],[15.6,31.4],[13.1,32.9],[11.2,33.4],[10.2,34.4],[11,35.4],[10.6,36.9],[9.7,37.3],[7,37]],
 // Adriatic
 [[12.3,45.6],[13.8,45.6],[15.2,44.3],[18.2,42.5],[19.4,41.8],[19.4,40.4],[18.4,40.1],[16.1,41.4],[14.1,42.4],[12.3,44.1]],
 // Black Sea
 [[27.6,42.5],[28.6,43.9],[29.7,45.3],[30.8,46.6],[33.5,46.6],[33.6,44.5],[35.3,44.8],[36.5,45.3],[38.2,46.6],[39.8,46.6],[38.3,44.8],[39.8,43.6],[41.6,42.1],[41.5,41.4],[38.4,40.9],[36.1,41.7],[34.5,42],[32.2,41.8],[31,41.2],[29.1,41.3],[28,41.7]],
 // Sea of Marmara
 [[26.8,40.4],[27.6,40.95],[29,41.05],[29.4,40.7],[28,40.35]],
 // Caspian
 [[46.8,46.6],[50.8,46.6],[53,45.1],[51,44.3],[51.3,43.1],[52.7,41.8],[52.9,40.4],[53.9,39.2],[53.9,37.3],[51.8,36.7],[50.3,37.3],[49,38.4],[49.4,40.4],[48.1,42.3],[47.4,43.5],[46.9,44.8]],
 // Red Sea
 [[32.4,30],[33.3,28.4],[34.9,29.5],[34.6,27.8],[36.6,25.8],[38.2,24],[39.1,21.4],[40.8,18.8],[42.6,16.2],[44,14.8],[43,13.4],[41,15.2],[39.1,17],[37.4,18.8],[37.2,21],[35.7,23.6],[34.3,26],[33.5,27.5]],
 // Persian Gulf
 [[47.9,30],[49.5,30.1],[50.9,28.8],[51.6,27.8],[53.6,26.7],[55.6,26.7],[56.3,27.1],[56.5,26.3],[56,25.8],[55.3,25.3],[54.4,24.3],[53,24.1],[51.7,24.1],[51.3,26.1],[50.8,25.5],[50.4,26.6],[49.9,27],[48.9,27.8],[48.4,28.7]],
 // Gulf of Oman / Arabian Sea
 [[56.5,26.6],[57.6,25.6],[61.5,25.3],[61.5,15],[52,15],[55,17.2],[56.8,18.6],[57.8,19.9],[58.8,21.3],[59.8,22.4],[58.8,23.6],[57.4,23.9],[56.4,24.8],[56.3,25.7]]
];
const MW=160,MH=90,mapC=document.createElement('canvas');mapC.width=MW;mapC.height=MH;
const waterPix=[];
(function buildMap(){
  const m=mapC.getContext('2d'),s=MW/W;
  const G=[111,214,111],S=[244,201,93],B=[185,220,106],Wt=[47,124,255],SH=[102,178,255],DG=[74,178,92],DS=[222,170,70];
  m.fillStyle='rgb(111,214,111)';m.fillRect(0,0,MW,MH);
  m.fillStyle='rgb(185,220,106)';m.fillRect(0,PY(34.6)*s,MW,MH);
  m.fillStyle='rgb(244,201,93)';m.fillRect(0,PY(32.4)*s,MW,MH);
  m.fillStyle='rgb(47,124,255)';
  WATER.forEach(poly=>{m.beginPath();poly.forEach(([lo,la],i)=>{const x=PX(lo)*s,y=PY(la)*s;i?m.lineTo(x,y):m.moveTo(x,y)});m.closePath();m.fill();});
  const id=m.getImageData(0,0,MW,MH),d=id.data,pal=[G,S,B,Wt],isW=new Uint8Array(MW*MH);
  for(let i=0;i<MW*MH;i++){let best=0,bd=1e9;for(let k=0;k<4;k++){const c=pal[k],dd=(d[i*4]-c[0])**2+(d[i*4+1]-c[1])**2+(d[i*4+2]-c[2])**2;if(dd<bd){bd=dd;best=k}}
    const c=pal[best];d[i*4]=c[0];d[i*4+1]=c[1];d[i*4+2]=c[2];d[i*4+3]=255;isW[i]=best===3?1:0;}
  seed=11;
  for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){const i=y*MW+x;

    R(bx-4,by-4,bw+8,96,'#000');R(bx-2,by-2,bw+4,92,RAINBOW[Math.floor(t*6)%7]);R(bx,by,bw,88,'#12124a');
    T('CAREER QUEST',W/2,by+12,16,'#ffd23f','center');T('ERSIN İNANKUL',W/2,by+40,9,'#3de0ff','center');T('1998 → TODAY',W/2,by+56,7,'#fff','center');
    if(Math.sin(t*6)>0||RM)T('PRESS START ▶',W/2,by+72,6,'#ff5fa2','center');}};
function travel(a,b,y0,y1,mode,cap,lvl,outfit,ff){
  return{kind:'map',dur:ff?3:2.4,year:[y0,y1],lvl,cap,hops:[[a,b]],ff,
    ev:[[.2,()=>SFX.whoosh()],[ff?2.7:2.1,()=>{const p=P(b);burst(p.x,p.y,26);SFX.ding();}]],
    draw(lt,t,idx){mapBase(idx,t);const A=P(a),B=P(b),k=easeIO((lt-.2)/(this.dur-.6)),lift=mode==='car'?.12:.35;
      cityDot(a,'#ffd23f');cityDot(b,k>=1?'#ffd23f':'#fff',true,true);trail(A,B,k,'#ff5fa2',lift);
      const p=bez(A,B,k,lift),q=bez(A,B,Math.min(1,k+.02),lift);
      if(mode==='car')drawCar(p.x,p.y+3,2,B.x<A.x);else drawPlane(p.x,p.y,k>=.98?(B.x<A.x?Math.PI:0):Math.atan2(q.y-p.y,q.x-p.x),2);
      if(ff){const on=Math.sin(t*10)>0||RM;R(W/2-104,14,208,24,'#000');T('FAST FORWARD »',W/2,22,9,on?'#ffd23f':'#ff5fa2','center');}
      else{const tag=mode==='car'?'ON THE ROAD':'✈ IN FLIGHT';T(tag,W/2,20,8,'#fff','center');}
      if(k>=1)drawChar(B.x,B.y-3,outfit,0,1);}};
}
const TRKPINS=[[28.9,41.0],[32.9,39.9],[30.7,36.9]];
const P2011={kind:'map',dur:6.6,year:[2011,2011],stop:'2011',lvl:7,
  cap:{who:'2011 · LEVEL UP',role:'TAV Information Technologies — Deputy General Manager',txt:'22 airports, 95 IT specialists, €49M budget. Pins across Türkiye, Saudi Arabia (Dammam, Riyadh) and North Macedonia (Skopje, Ohrid).'},
  ev:[[1.0,()=>{const p=P('IST');burst(p.x,p.y-10,40,RAINBOW,110);shake(.35);SFX.power();}],[.55,()=>{shake(.3);SFX.levelUp();}],...Array.from({length:7},(_,i)=>[1.8+i*.22,()=>SFX.pop()])],
  stats:[{t:3.6,txt:'22 AIRPORTS'},{t:4.2,txt:'95 IT SPECIALISTS'},{t:4.8,txt:'€49M BUDGET'}],
  draw(lt,t,idx){mapBase(idx,t);const I=P('IST');
    const pins=[...TRKPINS.map(([lo,la])=>({x:PX(lo),y:PY(la)})),P('DMM'),P('RUH'),P('SKP'),P('OHD')];
    pins.forEach((p,i)=>{const s=RM?1:backOut((lt-1.8-i*.22)/.4);if(lt>1.8+i*.22||RM)pin(p.x,p.y-2,i<3?'#ff4d6d':i<5?'#2bb24c':'#7a5cff',s);});
    if(lt>2.5){['DMM','RUH','SKP','OHD'].forEach(k=>cityDot(k,'#ffd23f'));T('TÜRKİYE',PX(34),PY(37.6),6,'#fff','center');T('SAUDI ARABIA',PX(46),PY(28.2),6,'#fff','center');T('N. MACEDONIA',PX(19),PY(43.2),6,'#fff','center');}
    drawChar(I.x,I.y-2,lt>=1?3:2,0,2);
    stats(this.stats,lt,I.x,I.y-30);banner('LEVEL UP!','DEPUTY GENERAL MANAGER',lt-.3);}};
P2011.ev.push(...P2011.stats.map(s=>[s.t,()=>{const p=P('IST');burst(p.x,p.y-20,12,['#ffd23f','#fff'],60);SFX.coin();}]));
const TOUR=['IST','RUH','MED','ADB','DOH','JED','MCT','TIP','SEB','IST'],PAX={ADB:'IZMIR 25M PAX/YR',DOH:'DOHA 24M PAX/YR',TIP:'TRIPOLI 20M PAX/YR'};
const HOP=.78;
const T2013={kind:'map',dur:TOUR.length*HOP+.6,year:[2013,2013],stop:'2013',lvl:8,
  hops:TOUR.slice(1).map((k,i)=>[TOUR[i],k]),
  cap:{who:'2013 · REGIONAL TOUR ✈',role:'TAV Investment Holding — IT Coordinator',txt:'Quick hops: Riyadh, Medina, Izmir, Doha, Jeddah, Muscat, Tripoli, Sebha.'},
  ev:TOUR.slice(1).map((k,i)=>[(i+1)*HOP+.1,()=>{const p=P(k);burst(p.x,p.y,16,RAINBOW,70);PAX[k]?SFX.coin():SFX.ding();}]),
  draw(lt,t,idx){drawMap(t);pastTrails(idx);visited(idx-1).forEach(k=>cityDot(k,'#ffd23f',false));
    const h=Math.min(TOUR.length-2,Math.floor((lt-.1)/HOP)),k=RM?1:easeIO(((lt-.1)-h*HOP)/HOP);
    for(let i=0;i<=h;i++){const A=P(TOUR[i]),B=P(TOUR[i+1]);trail(A,B,i<h?1:Math.max(0,k),RAINBOW[i%7],.3);}
    for(let i=1;i<=h+(k>=1?1:0)&&i<TOUR.length;i++)cityDot(TOUR[i],'#ffd23f',TOUR[i]!=='IST');
    const A=P(TOUR[Math.max(0,h)]),B=P(TOUR[Math.max(0,h)+1]),kk=Math.max(0,k),p=bez(A,B,kk,.3),q=bez(A,B,Math.min(1,kk+.03),.3);
    drawPlane(p.x,p.y,Math.atan2(q.y-p.y,q.x-p.x),2);
    let n=0;Object.keys(PAX).forEach(c=>{const vi=TOUR.indexOf(c);if(h+1>=vi||(h+1===vi-0&&k>=1)){const tt=lt-(vi*HOP+.1);if(tt<0)return;
      const Q=P(c),s=RM?1:backOut(tt/.4),txt=PAX[c],w=tw(txt,6)+10,x=clamp(Q.x-w/2,4,W-w-4),y=Q.y+8+(c==='DOH'?6:0);
      if(s>0){R(x-1,y-1,w+2,13,'#000');R(x,y,w,11,'#ff5fa2');T(txt,x+5,y+2,6,'#fff','left',null);}n++;}});
    T('✈ REGIONAL TOUR',W/2,20,8,'#fff','center');}};
const SEGS=[INTRO,S1998,S2002,
  travel('KAY','IST',2002,2005,'car',{who:'2002 → 2005 · FAST FORWARD',role:'Next stop: Istanbul',txt:'Years whizz by on the road to Istanbul…'},2,0,true),
  S2005,travel('IST','TBS',2005,2006,'plane',{who:'✈ ISTANBUL → GEORGIA',role:'Country move!',txt:'Wheels up for Tbilisi…'},3,1),
  S2006,travel('TBS','NBE',2006,2007,'plane',{who:'✈ GEORGIA → TUNISIA',role:'Country move!',txt:'Next up: Enfidha and Monastir…'},4,1),
  S2007,travel('NBE','IST',2007,2010,'plane',{who:'✈ TUNISIA → ISTANBUL',role:'Heading home',txt:'Back to Istanbul…'},5,1),
  S2010,P2011,T2013,S2015,S2018,S2020,
  travel('IST','DXB',2020,2023,'plane',{who:'✈ ISTANBUL → DUBAI',role:'Country move!',txt:'Next destination: Dubai…'},11,4),
  S2023,S2025,CELEB];
// ================= ENGINE =================
let acc=0;SEGS.forEach(s=>{s.start=acc;acc+=s.dur;});const TOTAL=acc;
let Tm=0,clk=0,playing=!RM,speed=1,cur=-1,prevLt=0,shakeT=0,last=performance.now(),typed=-1;
function shake(d){if(!RM)shakeT=Math.max(shakeT,d);}
const $=id=>document.getElementById(id);
const STOPS=SEGS.map((s,i)=>s.stop?i:-1).filter(i=>i>=0);
STOPS.forEach(i=>{const b=document.createElement('button');b.className='chip';b.textContent=SEGS[i].stop;b.onclick=()=>go(i);$('chips').appendChild(b);SEGS[i].chip=b;});
const esc=x=>x.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const sym=x=>esc(x).replace(/[→✈]/g,c=>'<span class="sym">'+c+'</span>');
function segAt(t){for(let i=SEGS.length-1;i>=0;i--)if(t>=SEGS[i].start)return i;return 0;}
function go(i){Tm=SEGS[i].start;parts=[];bgParts=[];cur=-1;if(!playing)render(0);}
function render(dt){
  const i=segAt(Tm),s=SEGS[i],lt=Tm-s.start;
  if(i!==cur){cur=i;prevLt=lt>.05?lt:-1;typed=-1;$('dwho').innerHTML=sym(s.cap.who);$('drole').innerHTML=sym(s.cap.role);
    STOPS.forEach(j=>SEGS[j].chip.classList.toggle('on',j===STOPS.filter(k=>k<=i).pop()));
    const on=SEGS[STOPS.filter(k=>k<=i).pop()];if(on&&on.chip){const c=$('chips'),b=on.chip;if(b.offsetLeft<c.scrollLeft||b.offsetLeft+b.offsetWidth>c.scrollLeft+c.clientWidth)c.scrollLeft=b.offsetLeft-c.clientWidth/2;}}
  if(playing)(s.ev||[]).forEach(([et,fn])=>{if(prevLt<et&&lt>=et)fn();});prevLt=lt;
  ctx.save();ctx.clearRect(0,0,W,H);
  if(shakeT>0){shakeT-=dt;ctx.translate(Math.round((Math.random()-.5)*6),Math.round((Math.random()-.5)*6));}
  parts=updParts(parts,dt);bgParts=updParts(bgParts,dt);flashT=Math.max(0,flashT-dt);snd.want=(s===S2025||s===CELEB)?'B':'A';s.draw(lt,clk,i);drawParts(parts);ctx.restore();
  const y=s.yearText||String(Math.floor(lerp(s.year[0],s.year[1],s.ff?clamp(lt/(s.dur-.4)):easeIO(lt/s.dur))));
  if($('year').textContent!==y)$('year').textContent=y;
  $('lvl').firstChild.nodeValue='LV '+s.lvl+(s.lvl===13?' ★':'');
  $('xp').style.width=Math.round(clamp(lt/s.dur)*100)+'%';$('bar').style.width=(Tm/TOTAL*100)+'%';
  const n=RM?s.cap.txt.length:Math.min(s.cap.txt.length,Math.floor(lt*40));
  if(n!==typed){typed=n;$('dtxt').textContent=s.cap.txt.slice(0,n);}
}
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;
  if(playing){Tm+=dt*speed;clk+=dt*speed;if(Tm>=TOTAL){Tm=0;cur=-1;parts=[];bgParts=[];snd.step=0;}}
  render(playing?dt*speed:0);musicTick();requestAnimationFrame(frame);}
function setPlay(p){playing=p;$('play').textContent=p?'❚❚ PAUSE':'▶ PLAY';}
$('play').onclick=()=>setPlay(!playing);
$('next').onclick=()=>{const i=segAt(Tm),n=STOPS.find(k=>k>i);go(n===undefined?0:n);};
$('prev').onclick=()=>{const i=segAt(Tm),lt=Tm-SEGS[i].start,c=STOPS.filter(k=>k<=i),p=(lt>1.2&&SEGS[i].stop)?i:(c.length>1?c[c.length-(SEGS[i].stop?2:1)]:0);go(p||0);};
function setSnd(on){snd.on=on;$('snd').textContent=on?'♪ SOUND ON':'♪ SOUND OFF';$('snd').classList.toggle('off',!on);
  try{localStorage.setItem('cq-sound',on?'on':'off');}catch(e){}
  if(on){audioInit();if(snd.ac)snd.ac.resume().then(()=>SFX.coin());}else if(snd.ac)snd.ac.suspend();}
$('snd').onclick=()=>setSnd(!snd.on);
$('snd').textContent=snd.on?'♪ SOUND ON':'♪ SOUND OFF';$('snd').classList.toggle('off',!snd.on);
const SPEEDS=[1,2,.5];$('spd').onclick=()=>{speed=SPEEDS[(SPEEDS.indexOf(speed)+1)%3];$('spd').textContent='SPEED '+(speed===.5?'½':speed)+'×';};
$('prog').onclick=e=>{const r=e.currentTarget.getBoundingClientRect();Tm=clamp((e.clientX-r.left)/r.width)*TOTAL*.999;cur=-1;parts=[];bgParts=[];};
addEventListener('keydown',e=>{if(e.target.tagName==='BUTTON'&&e.key===' ')return;
  if(e.key===' '){e.preventDefault();setPlay(!playing);}else if(e.key==='ArrowRight')$('next').click();else if(e.key==='ArrowLeft')$('prev').click();else if(e.key==='m'||e.key==='M')setSnd(!snd.on);});
if(RM){$('note').textContent+=' · Reduced motion is on: effects are calmer and playback starts paused.';}
setPlay(playing);
(document.fonts?document.fonts.ready:Promise.resolve()).then(()=>{typed=-1;});
requestAnimationFrame(frame);
</script>
